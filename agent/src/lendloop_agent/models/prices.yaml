# List prices in US dollars per 1 million tokens, used to put a cost on every model call.
#
# Only prices that several sources agreed on are listed, each with where it came from.
# A model missing here still works: its calls are recorded with tokens but no cost,
# and `lendloop-agent models list` says "no price". Check the provider's own pricing
# page before relying on a number, and update `as_of` when you do.
#
# badge: "recommended" (best results in our evals), "budget" (cheapest; may make more
# mistakes), "local" (runs on your machine).

anthropic:
  claude-haiku-5-5: { input: 0.10, output: 0.50, badge: budget }
  claude-sonnet-5-5: { input: 2.00, output: 10.00, badge: recommended }
  claude-opus-5-5: { input: 4.00, output: 20.00 }
  _source: https://pecollective.com/tools/anthropic-api-pricing/
  _as_of: 2026-11-05

openai:
  gpt-5.4-mini: { input: 0.75, output: 4.50, badge: recommended }
  gpt-5.4-nano: { input: 0.20, output: 1.25, badge: budget }
  _source: https://openai.com/index/introducing-gpt-5-4-mini-and-nano/
  _as_of: 2026-11-05

google_genai:
  # The free tier costs nothing up to its rate limits; this is the paid list price.
  gemini-2.5-flash-lite: { input: 0.10, output: 0.40, badge: budget }
  _source: https://cloud.google.com/gemini-enterprise-agent-platform/generative-ai/pricing
  _as_of: 2026-11-05

ollama:
  # Local models cost no money; their tokens and time are still recorded.
  "*": { input: 0, output: 0, badge: local }
